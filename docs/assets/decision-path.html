    <body><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="decision-path-title decision-path-desc">
    <title id="decision-path-title">From request to a reviewed decision</title><desc id="decision-path-desc">A request passes through role selection, an evidence-linked artifact, review, and a recorded decision.</desc>
    <defs><marker id="decision-path-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#53685a"/></marker></defs>
    <rect width="1280" height="720" fill="#f8f6f1"/><text x="40" y="48" class="eyebrow">BUSINESS ANALYSIS AGENTS / WORKING LOOP</text><text x="40" y="100" class="heading">Make the decision reviewable.</text><text x="40" y="140" class="caption">A useful artifact carries its evidence, assumptions, and open questions with it.</text><path d="M248 328 H288" fill="none" stroke="#53685a" stroke-width="1.5" marker-end="url(#decision-path-arrow)"/><path d="M496 328 H536" fill="none" stroke="#53685a" stroke-width="1.5" marker-end="url(#decision-path-arrow)"/><path d="M744 328 H784" fill="none" stroke="#53685a" stroke-width="1.5" marker-end="url(#decision-path-arrow)"/><path d="M992 328 H1032" fill="none" stroke="#53685a" stroke-width="1.5" marker-end="url(#decision-path-arrow)"/><g id="step-0"><rect x="40" y="272" width="208" height="112" rx="8" fill="#fffefa" stroke="#25392f" stroke-width="1.5"/>
    <text x="60" y="308" class="node-name">Request</text>
    <text x="60" y="336" class="node-sub">Define the outcome</text></g><g id="step-1"><rect x="288" y="272" width="208" height="112" rx="8" fill="#fffefa" stroke="#25392f" stroke-width="1.5"/>
    <text x="308" y="308" class="node-name">Select a role</text>
    <text x="308" y="336" class="node-sub">Resolve a focused gap</text></g><g id="step-2"><rect x="536" y="272" width="208" height="112" rx="8" fill="#fffefa" stroke="#25392f" stroke-width="1.5"/>
    <text x="556" y="308" class="node-name">Build an artifact</text>
    <text x="556" y="336" class="node-sub">Keep sources visible</text></g><g id="step-3"><rect x="784" y="272" width="208" height="112" rx="8" fill="#f5e5dc" stroke="#9d3c23" stroke-width="1.5"/>
    <text x="804" y="308" class="node-name">Review</text>
    <text x="804" y="336" class="node-sub">Check claims and limits</text></g><g id="step-4"><rect x="1032" y="272" width="208" height="112" rx="8" fill="#fffefa" stroke="#25392f" stroke-width="1.5"/>
    <text x="1052" y="308" class="node-name">Decide</text>
    <text x="1052" y="336" class="node-sub">Record the next action</text></g><text x="40" y="460" class="caption">Revisit earlier work when review exposes missing evidence. Stop when the requested decision is supported.</text><line x1="40" y1="648" x2="1240" y2="648" stroke="#53685a" stroke-width="1"/><text x="40" y="680" class="caption">Clear behavior, business value, and authorized approval are distinct checks.</text></svg></div></main></body></html>
