<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="ba-skills-title ba-skills-desc">
  <title id="ba-skills-title">Start with the question, not every skill</title>
  <desc id="ba-skills-desc">A business question is routed to the relevant skills. Discovery includes problem framing and stakeholder discovery. Decisions include requirements and prioritization. Change and outcomes include process design, impact, and outcome review. Evidence and human acceptance determine whether the result is useful; this is not a mandatory linear workflow.</desc>
  <defs>
    <marker id="ba-skills-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#bcc6d3"/>
    </marker>
    <marker id="ba-skills-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#f08a59"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="12" fill="#101722"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <path d="M480 238 V294" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#ba-skills-arrow)"/>
    <path d="M480 380 V416 H172 M480 416 H788" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M172 416 V454" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#ba-skills-arrow)"/>
    <path d="M480 416 V454" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#ba-skills-arrow)"/>
    <path d="M788 416 V454" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#ba-skills-arrow)"/>
    <text x="36" y="40" font-size="12" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="1.8">BUSINESS ANALYSIS AGENTS</text>
    <text x="36" y="80" font-size="29" fill="#f3f1e9" text-anchor="start" font-weight="600" letter-spacing="0">Start with the question, not every skill</text>
    <text x="36" y="110" font-size="17" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">The orchestrator selects a bounded analysis path in the existing AI host</text>
    <g data-node-id="question">
      <rect data-role="bounds" x="330" y="146" width="300" height="92" rx="9" fill="#1a2636" stroke="#f08a59" stroke-width="2"/>
      <text x="480.0" y="177" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Business question</text>
      <text x="480.0" y="204" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Outcome + constraints</text>
    </g>
    <g data-node-id="router">
      <rect data-role="bounds" x="330" y="294" width="300" height="86" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="480.0" y="325" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">BA orchestrator</text>
      <text x="480.0" y="352" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Select only relevant skills</text>
    </g>
    <g data-node-id="group-0">
      <rect data-role="bounds" x="36" y="454" width="272" height="112" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="172.0" y="485" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Discover</text>
      <text x="172.0" y="512" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Problem framing</text>
      <text x="172.0" y="535" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Stakeholder evidence</text>
    </g>
    <g data-node-id="group-1">
      <rect data-role="bounds" x="344" y="454" width="272" height="112" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="480.0" y="485" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Decide</text>
      <text x="480.0" y="512" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Requirements</text>
      <text x="480.0" y="535" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Prioritization</text>
    </g>
    <g data-node-id="group-2">
      <rect data-role="bounds" x="652" y="454" width="272" height="112" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="788.0" y="485" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Change + learn</text>
      <text x="788.0" y="512" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Process + impact</text>
      <text x="788.0" y="535" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Outcome review</text>
    </g>
    <text x="36" y="594" font-size="15" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Each path produces a reviewable artifact. Diagram briefs support any path; tools stay host-owned.</text>
  </g>
</svg>
