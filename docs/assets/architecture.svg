<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="business-analysis-agents-title business-analysis-agents-desc" id="architecture-root"><title id="business-analysis-agents-title">Business Analysis Agents | From questions to evidence</title><desc id="business-analysis-agents-desc">ANALYSIS WORKFLOW. PORTABLE EXECUTION BOUNDARY. Business analysis task: Problem, stakeholders, and outcome. Selected analysis skill: A bounded specialist method. Structured artifact: Requirements, process, or decision. Portable skill package: Reusable instructions and resources. Existing AI host: Tools and models belong to the host. Human judgment: Review and acceptance stay explicit. Skills guide analysis; they do not create independent services or bypass host permissions.</desc>
